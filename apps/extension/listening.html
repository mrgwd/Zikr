<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Katheera — Listening</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #0f1117;
        color: #e2e8f0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        gap: 24px;
      }

      .orb {
        width: 80px;
        height: 80px;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 35%, #4ade80, #16a34a);
        box-shadow: 0 0 0 0 rgba(74, 222, 128, 0.4);
        animation: pulse 2s ease-in-out infinite;
      }

      @keyframes pulse {
        0%   { box-shadow: 0 0 0 0   rgba(74,222,128,0.4); }
        50%  { box-shadow: 0 0 0 20px rgba(74,222,128,0);   }
        100% { box-shadow: 0 0 0 0   rgba(74,222,128,0.4); }
      }

      h1 {
        font-size: 1.1rem;
        font-weight: 500;
        color: #94a3b8;
        letter-spacing: 0.05em;
      }

      p {
        font-size: 0.8rem;
        color: #475569;
        text-align: center;
        max-width: 260px;
        line-height: 1.6;
      }

      button {
        margin-top: 8px;
        padding: 8px 24px;
        border-radius: 999px;
        border: 1px solid #334155;
        background: transparent;
        color: #94a3b8;
        font-size: 0.8rem;
        cursor: pointer;
        transition: background 0.2s, color 0.2s;
      }

      button:hover {
        background: #1e293b;
        color: #e2e8f0;
      }
    </style>
  </head>
  <body>
    <div class="orb"></div>
    <h1>Katheera is listening…</h1>
    <p>Close this tab to stop. Your voice never leaves your device.</p>
    <button id="stopBtn">Stop listening</button>
    <script type="module" src="./src/listening.ts"></script>
  </body>
</html>
